<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Stained Glass Quote Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            putty: "#F7F4EE",
            ink: "#2B2B2E",
            steel: "#2C5F8A",
            leaf: "#3F6B4F",
            garnet: "#8B3A3A",
            brass: "#8C7A52",
          },
          fontFamily: {
            serif: ['"Fraunces"', "ui-serif", "Georgia", "serif"],
            sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-putty text-ink min-h-screen">
  <header class="bg-putty">
    <div class="max-w-5xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-6">
        <h1 class="text-xl font-display font-semibold tracking-tight">Stained Glass Quote Tool</h1>
        <nav class="flex gap-5 text-sm">
          <a href="index.html" class="text-ink/60 hover:text-ink">Quotes</a>
          <a href="customers.html" class="font-medium text-ink border-b border-ink pb-0.5">Customers</a>
        </nav>
      </div>
      <div class="flex items-center gap-2 text-sm">
        <label for="api-base-input" class="text-ink/50">API base</label>
        <input id="api-base-input" type="text" class="border border-ink/20 rounded-sm px-2 py-1 w-56 text-xs bg-white/60 focus:outline-none focus:ring-1 focus:ring-ink/40" />
      </div>
    </div>
  </header>
  <div class="came-line" aria-hidden="true"></div>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="bg-white/60 border border-ink/12 rounded-sm p-5">
      <h2 class="font-display text-lg font-semibold mb-3">New customer</h2>
      <form id="new-customer-form" class="grid gap-3 sm:grid-cols-2">
        <div>
          <label class="block text-sm text-ink/60 mb-1">Name</label>
          <input id="customer-name" required class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div>
          <label class="block text-sm text-ink/60 mb-1">Email</label>
          <input id="customer-email" type="email" class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div>
          <label class="block text-sm text-ink/60 mb-1">Phone</label>
          <input id="customer-phone" class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div>
          <label class="block text-sm text-ink/60 mb-1">Notes</label>
          <input id="customer-notes" class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div class="sm:col-span-2 flex items-center gap-3">
          <button type="submit" class="bg-ink text-putty px-4 py-1.5 rounded-sm text-sm font-medium hover:bg-ink/90">
            Add customer
          </button>
          <span id="new-customer-error" class="text-sm text-garnet"></span>
        </div>
      </form>
    </section>

    <section class="bg-white/60 border border-ink/12 rounded-sm">
      <div class="flex items-center justify-between p-5 pb-0">
        <h2 class="font-display text-lg font-semibold">Customers</h2>
        <button id="refresh-customers" class="text-sm text-ink/60 hover:text-ink hover:underline">Refresh</button>
      </div>
      <div id="customers-status" class="px-5 py-3 text-sm text-ink/50"></div>
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-ink/50 text-xs uppercase tracking-wide border-b border-ink/15">
            <th class="px-5 py-2 font-medium">ID</th>
            <th class="px-5 py-2 font-medium">Name</th>
            <th class="px-5 py-2 font-medium">Email</th>
            <th class="px-5 py-2 font-medium">Phone</th>
            <th class="px-5 py-2 font-medium">Created</th>
          </tr>
        </thead>
        <tbody id="customers-body"></tbody>
      </table>
    </section>
  </main>

  <script src="api.js"></script>
  <script>
    async function loadCustomers() {
      const status = document.getElementById("customers-status");
      const body = document.getElementById("customers-body");
      status.textContent = "Loading…";
      body.innerHTML = "";
      try {
        const customers = await apiFetch("/customers");
        status.textContent = customers.length === 0 ? "No customers yet." : "";
        body.innerHTML = customers
          .map(
            (c) => `
          <tr class="border-b border-ink/10 last:border-0">
            <td class="px-5 py-2 font-mono text-ink/70">${c.id}</td>
            <td class="px-5 py-2">${escapeHtml(c.name)}</td>
            <td class="px-5 py-2">${escapeHtml(c.email || "—")}</td>
            <td class="px-5 py-2">${escapeHtml(c.phone || "—")}</td>
            <td class="px-5 py-2 text-ink/50">${new Date(c.created_at).toLocaleDateString()}</td>
          </tr>`
          )
          .join("");
      } catch (err) {
        status.textContent = `Error loading customers: ${err.message}`;
      }
    }

    document.getElementById("new-customer-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("new-customer-error");
      errorEl.textContent = "";
      const payload = {
        name: document.getElementById("customer-name").value,
        email: document.getElementById("customer-email").value || null,
        phone: document.getElementById("customer-phone").value || null,
        notes: document.getElementById("customer-notes").value || null,
      };
      try {
        await apiFetch("/customers", { method: "POST", body: JSON.stringify(payload) });
        e.target.reset();
        await loadCustomers();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });

    document.getElementById("refresh-customers").addEventListener("click", loadCustomers);

    loadCustomers();
  </script>
</body>
</html>
