<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Stained Glass Quote Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            putty: "#F7F4EE",
            ink: "#2B2B2E",
            steel: "#2C5F8A",
            leaf: "#3F6B4F",
            garnet: "#8B3A3A",
            brass: "#8C7A52",
          },
          fontFamily: {
            serif: ['"Fraunces"', "ui-serif", "Georgia", "serif"],
            sans: ['"Inter"', "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"],
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-putty text-ink min-h-screen">
  <header class="bg-putty">
    <div class="max-w-5xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-xl font-display font-semibold tracking-tight">Stained Glass Quote Tool</h1>
      <div class="flex items-center gap-2 text-sm">
        <label for="api-base-input" class="text-ink/50">API base</label>
        <input id="api-base-input" type="text" class="border border-ink/20 rounded-sm px-2 py-1 w-56 text-xs bg-white/60 focus:outline-none focus:ring-1 focus:ring-ink/40" />
      </div>
    </div>
  </header>
  <div class="came-line" aria-hidden="true"></div>

  <main class="max-w-sm mx-auto px-4 py-16">
    <div class="bg-white/60 border border-ink/12 rounded-sm p-6 space-y-4">
      <h2 class="font-display text-lg font-semibold">Log in</h2>
      <form id="login-form" class="space-y-3">
        <div>
          <label class="block text-sm text-ink/60 mb-1">Username</label>
          <input id="login-username" required autocomplete="username" class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div>
          <label class="block text-sm text-ink/60 mb-1">Password</label>
          <input id="login-password" type="password" required autocomplete="current-password" class="w-full border border-ink/20 rounded-sm px-2 py-1.5 bg-white focus:outline-none focus:ring-1 focus:ring-ink/40" />
        </div>
        <div class="flex items-center gap-3 pt-1">
          <button type="submit" class="bg-ink text-putty px-4 py-1.5 rounded-sm text-sm font-medium hover:bg-ink/90">
            Log in
          </button>
          <span id="login-error" class="text-sm text-garnet"></span>
        </div>
      </form>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("login-error");
      errorEl.textContent = "";
      try {
        await apiFetch("/auth/login", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("login-username").value,
            password: document.getElementById("login-password").value,
          }),
        });
        location.href = "index.html";
      } catch (err) {
        errorEl.textContent = "Invalid username or password.";
      }
    });

    // If already logged in, skip straight past the login form.
    apiFetch("/auth/me").then(() => { location.href = "index.html"; }).catch(() => {});
  </script>
</body>
</html>
